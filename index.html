<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web xử lý công việc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🚌 Web xử lý công việc</h1>
  <p class="sub">Kéo thả file Excel vào khung, chọn tác vụ cần chạy</p>
</header>

<main>

  <!-- KHU UPLOAD -->
  <section class="card">
    <h2>📁 Kho dữ liệu</h2>
    <div id="dropzone" class="dropzone">
      <div class="dz-icon">📥</div>
      <div class="dz-text">Kéo thả file Excel vào đây<br><span>hoặc bấm để chọn file</span></div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" multiple hidden>
    </div>
    <div id="fileList" class="file-list"></div>
    <div class="actions">
      <button id="btnClearFiles" class="btn btn-ghost">🗑️ Xóa danh sách file</button>
    </div>
  </section>

  <!-- KHU TÁC VỤ -->
  <section class="card">
    <h2>⚡ Tác vụ</h2>
    <div class="task-grid">
      <button class="task-btn" data-action="soSanhEBMS">
        <div class="task-icon">📊</div>
        <div class="task-title">So sánh EBMS</div>
        <div class="task-desc">Đối chiếu phân công với EBMS</div>
      </button>
      <button class="task-btn" data-action="trichXuatV1">
        <div class="task-icon">👥</div>
        <div class="task-title">Trích xuất NV v1</div>
        <div class="task-desc">Ngày/Tuyến/Giờ đi/Tên/CV</div>
      </button>
      <button class="task-btn" data-action="trichXuatV2">
        <div class="task-icon">📋</div>
        <div class="task-title">Trích xuất NV v2</div>
        <div class="task-desc">Ngày/Tuyến/Tên/CV/Check</div>
      </button>
    </div>
  </section>

  <!-- KHU KẾT QUẢ -->
  <section class="card" id="resultCard" style="display:none">
    <div class="result-head">
      <h2 id="resultTitle">📊 Kết quả</h2>
      <div class="result-actions">
        <button id="btnExportCSV" class="btn btn-ghost">⬇️ Xuất CSV</button>
        <button id="btnCloseResult" class="btn btn-ghost">✖️ Đóng</button>
      </div>
    </div>
    <div id="summary" class="summary"></div>
    <div id="resultContent" class="result-content"></div>
  </section>

  <!-- LOG -->
  <section class="card">
    <h2>📜 Nhật ký</h2>
    <div id="log" class="log"></div>
  </section>

</main>

<div id="loading" class="loading" style="display:none">
  <div class="spinner"></div>
  <div id="loadingText">Đang xử lý...</div>
</div>

<script src="app.js"></script>
</body>
</html>
